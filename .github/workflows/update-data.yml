name: Auto Update ETF Data (0050 & 0056)

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 15:30 (收盤並結算盤後資料) -> UTC 07:30
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁或 Telegram 手動點擊「Run workflow」立即更新

jobs:
  update-etf-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest ETF & Stock Data & Run Screener
        run: |
          python scripts/fetch_data.py
          python scripts/screener.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update ETF & screener market data [skip ci]" && git push)

      - name: Push Telegram Daily Closing Report
        run: |
          python3 -c "
          import urllib.request, json, os
          token = '8986464959:AAG6Hl26vSx2mygIHi3knYzsxA3xf_UJr9s'
          chat_id = '5709621345'
          try:
              tracked = ['0050', '0056']
              if os.path.exists('data/tracked_etfs.json'):
                  with open('data/tracked_etfs.json') as f: tracked = json.load(f)
              cards = []
              report_date = '最新'
              for sym in tracked:
                  fpath = f'data/{sym}.json'
                  if not os.path.exists(fpath): continue
                  with open(fpath) as f: d = json.load(f)
                  m, q, inst = d['metadata'], d['quote'], d.get('institutional', {})
                  if 'date' in inst: report_date = inst['date']
                  s = '+' if q['change'] > 0 else ''
                  cards.append(f'''📊 *{sym} {m.get('short_name','')}*
          • 收盤：\`NT$ {q['price']}\` ({s}{q['change']} / {s}{q['change_percent']}%)
          • 淨值：\`NT$ {q.get('nav',0)}\` (折溢價 {q.get('discount_percent',0):+.2f}%)
          • 外資：\`{inst.get('foreign_lots', 0):,} 張\` ｜ 投信：\`{inst.get('trust_lots', 0):,} 張\`
          • 法人合計：\`{inst.get('total_lots', 0):,} 張\`''')

              if os.path.exists('data/screener_results.json'):
                  with open('data/screener_results.json') as sf:
                      s_data = json.load(sf)
                      top3 = s_data.get('top_picks', [])[:3]
                      if top3:
                          s_lines = ['🎯 *盤後多因子海選 TOP 3 突破標的*']
                          for p in top3:
                              s_lines.append(f\"• *{p['code']} {p['name']}* (\`NT$ {p['close']}\` / {p['score']}分) 法人+{p['institutional']['total_lots']:,}張, 融資{p['margin']['margin_change']:+,d}張\")
                          cards.append('\n'.join(s_lines))

              text = f'''📢 *ETF & 個股盤後日報 ({report_date})*
          ━━━━━━━━━━━━━━━━━━
          ''' + '\n\n'.join(cards) + '''

          🌐 [開啟手機專屬儀表板](https://rainbow0921li-afk.github.io/etf/)'''
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  data=json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'Markdown', 'disable_web_page_preview': True}).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
              )
              urllib.request.urlopen(req, timeout=10)
              print('Telegram daily report pushed successfully!')
          except Exception as e:
              print('Telegram push warning:', e)
          "
