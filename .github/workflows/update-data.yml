name: Auto Update ETF Data (0050 & 0056)

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 15:30 (收盤並結算盤後資料) -> UTC 07:30
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊「Run workflow」立即更新

jobs:
  update-etf-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest ETF Data (0050 & 0056)
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update ETF market data (0050 & 0056) [skip ci]" && git push)
